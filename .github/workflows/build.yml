name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish, e.g. v1.0.1 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the Windows C# compiler
        shell: cmd
        run: call build.bat

      - name: Package
        shell: pwsh
        run: |
          $out = "AgPath"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item AgPath.exe, README.md, LICENSE, icon.ico $out
          Copy-Item -Recurse lang, map, docs $out
          New-Item -ItemType Directory -Force "$out\tools" | Out-Null
          Copy-Item tools\TestSender.exe "$out\tools"
          Compress-Archive -Path $out -DestinationPath AgPath.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AgPath
          path: AgPath.zip

      - name: Publish release (tag push or manual run with a version)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
        run: gh release create "$env:VERSION" AgPath.zip --target "${{ github.sha }}" --title "AgPath $env:VERSION" --generate-notes
