name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish, e.g. v1.0.1 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the Windows C# compiler
        id: build
        continue-on-error: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
        shell: cmd
        run: call build.bat

      - name: Package
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $out = "AgPath"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item AgPath.exe, README.md, LICENSE, icon.ico $out
          Copy-Item -Recurse lang, map, docs $out
          New-Item -ItemType Directory -Force "$out\tools" | Out-Null
          Copy-Item tools\TestSender.exe, tools\AnInspect.exe "$out\tools" -ErrorAction SilentlyContinue
          Compress-Archive -Path $out -DestinationPath AgPath.zip -Force
          $k = "AgPathKirjaaja"
          New-Item -ItemType Directory -Force $k | Out-Null
          Copy-Item kirjaaja\AgPathKirjaaja.exe, LICENSE, icon.ico $k
          Copy-Item -Recurse kirjaaja\lang $k
          if (Test-Path kirjaaja\README.md) { Copy-Item kirjaaja\README.md $k }
          Compress-Archive -Path $k -DestinationPath AgPathKirjaaja.zip -Force

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: AgPath
          path: AgPath.zip

      - name: Publish release (tag push or manual run with a version)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
        run: gh release create "$env:VERSION" AgPath.zip --target "${{ github.sha }}" --title "AgPath $env:VERSION" --generate-notes

      - name: Publish development build to the dev-builds branch (non-main branches only)
        if: always() && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP "devb"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          if (Test-Path AgPath.zip) { Copy-Item AgPath.zip $tmp }
          if (Test-Path AgPathKirjaaja.zip) { Copy-Item AgPathKirjaaja.zip $tmp }
          Copy-Item build_log.txt $tmp -ErrorAction SilentlyContinue
          git checkout --orphan dev-builds
          git rm -rf -q .
          git clean -fdxq
          Copy-Item "$tmp\*" .
          git add -A
          git commit -q -m "Development build of ${{ github.ref_name }} ${{ github.sha }}"
          git push -f origin dev-builds
