name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the Windows C# compiler
        shell: cmd
        run: call build.bat

      - name: Package
        shell: pwsh
        run: |
          $out = "AgPath"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item AgPath.exe, README.md, LICENSE, icon.ico $out
          Copy-Item -Recurse lang, map $out
          New-Item -ItemType Directory -Force "$out\tools" | Out-Null
          Copy-Item tools\TestSender.exe "$out\tools"
          Compress-Archive -Path $out -DestinationPath AgPath.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AgPath
          path: AgPath.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" AgPath.zip --title "AgPath ${{ github.ref_name }}" --generate-notes
